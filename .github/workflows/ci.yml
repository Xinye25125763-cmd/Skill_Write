# CI：后端 pytest + 前端 typecheck/vitest/build。
# 任何 push / PR 都必须全绿，回归不留口头承诺。
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 仓库 pyproject 指向内网镜像；CI 环境覆盖为公网 PyPI
      - name: Install dependencies
        run: uv sync --locked
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple/
      - name: Run tests
        run: uv run pytest
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple/

  frontend:
    name: frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
